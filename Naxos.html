  const overlays = {};
  if (lodging.length > 0) {
    overlays['🏨 Καταλύματα'] = lodgingLayer;
  }
  L.control.layers(baseLayers, overlays, { position: 'topleft', collapsed: false }).addTo(map);
  // ------------------------------------------------------------------------

  if (trackPoints.length > 0) {
    const latlngs = trackPoints.map(p => [p[0], p[1]]);
    L.polyline(latlngs, { color: '#e6550d', weight: 4, opacity: 0.85 }).addTo(map);
    latlngs.forEach(p => bounds.push(p));

    L.circleMarker(latlngs[0], { radius: 7, color: '#2ca02c', fillColor: '#2ca02c', fillOpacity: 1 })
      .addTo(map).bindTooltip('Εκκίνηση');
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 7, color: '#d62728', fillColor: '#d62728', fillOpacity: 1 })
      .addTo(map).bindTooltip('Τέρμα');
  }

  const photoIcon = L.divIcon({
    className: '',
    html: '<div style="background:#3182bd;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });

  const photoIconTime = L.divIcon({
    className: '',
    html: '<div style="background:#9467bd;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });

  photos.forEach(p => {
    const icon = (p.source === 'time') ? photoIconTime : photoIcon;
    const marker = L.marker([p.lat, p.lon], { icon: icon }).addTo(map);
    const note = (p.source === 'time') ? '<div class="caption" style="color:#9467bd;">📍 εκτίμηση βάσει ώρας</div>' : '';
    const popupHtml = `<div class="popup-photo"><img src="${p.thumb}"><div class="caption">${p.name}</div>${note}</div>`;
    marker.bindPopup(popupHtml, { maxWidth: 300 });
    bounds.push([p.lat, p.lon]);
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30] });
  } else {
    map.setView([38.0, 23.7], 6); // fallback: Ελλάδα
  }
</script>
</body>
</html>
